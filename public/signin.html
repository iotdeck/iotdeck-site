<!doctype html>
<html lang="ar" dir="rtl" data-page="signin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoTDeck — تسجيل الدخول</title>
  <meta name="description" content="Connect your devices, build live dashboards, and control them from anywhere.">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <button class="btn btn-ghost" id="lang-toggle" type="button" style="position:fixed;top:12px;inset-inline-end:12px;z-index:5;">English</button>

  <main class="auth-shell">
    <section class="card auth-card" aria-labelledby="auth-title">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>IoTDeck</div>

      <h1 id="auth-title" data-i18n="welcome">أهلًا بك</h1>
      <p class="lead" data-i18n="signin_lead">سجّل الدخول لرؤية أجهزتك، أو أنشئ حسابًا في أقل من دقيقة.</p>

      <div class="tabs" role="tablist" aria-label="Sign in or create account">
        <button class="tab" role="tab" id="tab-signin" aria-selected="true" aria-controls="form" data-mode="signin" data-i18n="tab_signin">تسجيل الدخول</button>
        <button class="tab" role="tab" id="tab-signup" aria-selected="false" aria-controls="form" data-mode="signup" data-i18n="tab_signup">إنشاء حساب</button>
      </div>

      <a class="btn google-btn btn-block" id="google" href="/api/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36 26.7 37 24 37c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span data-i18n="google">المتابعة باستخدام Google</span>
      </a>

      <div class="divider" data-i18n="divider">أو بالبريد الإلكتروني</div>

      <form class="form" id="form" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="name" data-i18n="name_label">الاسم</label>
          <input class="input" id="name" name="name" autocomplete="name" maxlength="60" data-i18n-placeholder="name_ph" placeholder="اسمك">
        </div>
        <div class="field">
          <label for="email" data-i18n="email_label">البريد الإلكتروني</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password" data-i18n="password_label">كلمة المرور</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required minlength="10" data-i18n-placeholder="password_ph" placeholder="10 أحرف على الأقل">
        </div>
        <p class="error" id="error" role="alert"></p>
        <button class="btn btn-primary btn-block" id="submit" type="submit" data-i18n="submit_signin">تسجيل الدخول</button>
      </form>
    </section>
  </main>

  <script src="/i18n.js" defer></script>
  <script src="/signin.js" defer></script>
</body>
</html>
